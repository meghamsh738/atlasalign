name: Beta build and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare the same clean source distributed to beta users
        run: python scripts/prepare_public_snapshot.py --output public-source
      - name: Full portable tests and build
        working-directory: public-source
        run: python scripts/test.py --ci
      - name: Package beta and updater input
        working-directory: public-source
        run: python scripts/package_beta.py --output dist
      - name: Check bundle and launch Java on this platform
        working-directory: public-source
        run: python scripts/smoke_bundle.py dist/atlasalign-lite-0.1.0-beta.3
      - uses: actions/upload-artifact@v4
        with:
          name: beta-${{ matrix.os }}
          path: public-source/dist
